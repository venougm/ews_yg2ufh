# Konfigurasi Mosquitto untuk UJI LOKAL EWS (bukan untuk produksi).
# Jalankan manual:
#   & "C:\Program Files\mosquitto\mosquitto.exe" -v -c "c:\aws-kiro\EWS_YG2UFH\backend\mosquitto-local.conf"
#
# Listener di semua interface port 1883, tanpa autentikasi (hanya untuk lokal).
# JANGAN pakai config ini di VPS/produksi — di produksi WAJIB auth + listener terbatas.

listener 1883 0.0.0.0
allow_anonymous true

# Log ke stdout biar kelihatan saat uji
log_dest stdout
log_type all
