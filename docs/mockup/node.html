<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Detail Node — EWS YG2UFH</title>
<style>
  :root{
    --bg:#121417; --panel:#1c2025; --panel2:#22272e; --border:#2c333b;
    --accent:#e23b3b; --accent-soft:rgba(226,59,59,.14);
    --text:#e6edf3; --dim:#8b949e; --green:#2ea043; --amber:#d29922; --blue:#2f81f7;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);
    font-family:"Inter",system-ui,"Segoe UI",Roboto,sans-serif}
  .mock-note{background:#3a2416;color:#f0d9b5;text-align:center;
    padding:6px;font-size:12.5px;border-bottom:1px solid var(--amber)}
  .topbar{display:flex;align-items:center;gap:16px;background:var(--panel2);
    padding:12px 22px;border-bottom:1px solid var(--border)}
  .brand{color:var(--accent);font-weight:700;font-size:21px;letter-spacing:1px}
  .title{font-weight:600;font-size:17px}
  .spacer{flex:1}
  .dim{color:var(--dim)}
  .back{color:var(--blue);text-decoration:none;font-size:13px}
  .back:hover{text-decoration:underline}
  .wrap{padding:18px 22px;max-width:1200px;margin:0 auto}
  .status-dot{width:10px;height:10px;border-radius:50%;display:inline-block;margin-right:7px}
  .dot-green{background:var(--green)} .dot-amber{background:var(--amber)} .dot-red{background:var(--accent)}

  .head-card{background:var(--panel);border:1px solid var(--border);border-radius:14px;
    padding:20px 22px;margin-bottom:16px;display:flex;align-items:center;gap:20px;flex-wrap:wrap}
  .head-card h1{margin:0;font-size:22px}
  .head-card .loc{color:var(--dim);font-size:13px;margin-top:3px}
  .pill{font-size:11px;padding:3px 10px;border-radius:20px;border:1px solid;font-weight:600}
  .pill.online{color:var(--green);border-color:var(--green);background:rgba(46,160,67,.12)}
  .pill.offline{color:var(--accent);border-color:var(--accent);background:var(--accent-soft)}
  .pill.siaga{color:var(--amber);border-color:var(--amber);background:rgba(210,153,34,.12)}
  .kv{display:flex;gap:26px;flex-wrap:wrap}
  .kv .k{font-size:11px;color:var(--dim)} .kv .v{font-size:15px;font-family:Consolas,monospace}

  .grid{display:grid;grid-template-columns:repeat(2,1fr);gap:16px}
  .card{background:var(--panel);border:1px solid var(--border);border-radius:14px;padding:16px 18px}
  .card h3{margin:0 0 2px;font-size:14px}
  .card .csub{color:var(--dim);font-size:11.5px;margin-bottom:10px}
  .chartbox{height:200px;position:relative}
  .stat-row{display:flex;gap:20px;margin-top:10px;flex-wrap:wrap}
  .stat .s-lbl{font-size:11px;color:var(--dim)} .stat .s-val{font-size:15px;font-weight:600}
  .notfound{background:var(--panel);border:1px solid var(--border);border-radius:14px;
    padding:40px;text-align:center;color:var(--dim)}
  @media(max-width:900px){.grid{grid-template-columns:1fr}}
</style>
</head>
<body>
  <div class="mock-note">⚠ MOCKUP — grafik di bawah memakai DATA DUMMY (acak), belum terhubung ke MQTT/backend. Untuk review desain saja.</div>

  <div class="topbar">
    <span class="brand">YG2UFH</span>
    <span class="title">Detail Perangkat</span>
    <span class="spacer"></span>
    <a class="back" href="dashboard.html">← kembali ke dashboard</a>
  </div>

  <div class="wrap" id="content"><!-- diisi JS --></div>

<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<script>
  /* ===== MOCKUP — data dummy. Node dibaca dari localStorage 'ews_nodes'
     (sama dengan dashboard.html). Grafik = angka acak. ===== */

  const defaultNodes=[
    {id:'gw-01',  lat:-7.6900, lon:110.4050, status:'gw',    info:'Gateway · 2 node online'},
    {id:'node-01',lat:-7.7020, lon:110.3980, status:'amber', info:'SIAGA · tilt Δ+2.4° · RSSI -92'},
    {id:'node-02',lat:-7.6950, lon:110.4180, status:'green', info:'Aman · tilt Δ+0.1° · RSSI -78'}
  ];
  function loadNodes(){
    try{ const s=JSON.parse(localStorage.getItem('ews_nodes')); if(Array.isArray(s)&&s.length) return s; }catch(e){}
    return defaultNodes.slice();
  }
  function qs(name){ return new URLSearchParams(location.search).get(name); }
  function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}

  // ---- generator data dummy (deterministik per id, biar konsisten tiap buka) ----
  function seedRand(seed){ let s=seed>>>0; return ()=>{ s=(s*1664525+1013904223)>>>0; return s/4294967296; }; }
  function hashStr(str){ let h=2166136261>>>0; for(const c of str){ h^=c.charCodeAt(0); h=Math.imul(h,16777619);} return h>>>0; }
  function series(id,key,base,amp,n){
    const r=seedRand(hashStr(id+key)); const out=[]; let v=base;
    for(let i=0;i<n;i++){ v+=(r()-0.5)*amp; out.push(+v.toFixed(2)); } return out;
  }
  function labels24(n){
    const out=[]; const now=new Date();
    for(let i=n-1;i>=0;i--){ const d=new Date(now-i*3600*1000/ (n/24)); out.push(d.getHours().toString().padStart(2,'0')+':00'); }
    return out;
  }

  const COLORS={green:'#2ea043',amber:'#d29922',red:'#e23b3b',gw:'#e23b3b'};
  function statusMeta(st){
    if(st==='gw')   return {dot:'dot-green', pill:'online', text:'GATEWAY'};
    if(st==='amber')return {dot:'dot-amber', pill:'siaga',  text:'SIAGA'};
    if(st==='red')  return {dot:'dot-red',   pill:'offline',text:'OFFLINE'};
    return                 {dot:'dot-green', pill:'online', text:'ONLINE'};
  }

  function chartOpts(extra){
    return Object.assign({
      responsive:true, maintainAspectRatio:false,
      plugins:{legend:{labels:{color:'#8b949e',boxWidth:12,font:{size:11}}}},
      scales:{
        x:{ticks:{color:'#8b949e',maxTicksLimit:8,font:{size:10}},grid:{color:'#2c333b'}},
        y:{ticks:{color:'#8b949e',font:{size:10}},grid:{color:'#2c333b'}}
      }
    },extra||{});
  }
  function line(ctx,labels,datasets,extra){
    return new Chart(ctx,{type:'line',
      data:{labels,datasets:datasets.map(d=>Object.assign({tension:.3,pointRadius:0,borderWidth:2},d))},
      options:chartOpts(extra)});
  }

  function renderNode(node){
    const m=statusMeta(node.status);
    const L=labels24(48);
    document.getElementById('content').innerHTML=`
      <div class="head-card">
        <div>
          <h1><span class="status-dot ${m.dot}"></span>${esc(node.id)}</h1>
          <div class="loc">${esc(node.info||'')}</div>
        </div>
        <span class="pill ${m.pill}">${m.text}</span>
        <span class="spacer"></span>
        <div class="kv">
          <div><div class="k">node_id</div><div class="v">${esc(node.id)}</div></div>
          <div><div class="k">Koordinat</div><div class="v">${node.lat.toFixed(4)}, ${node.lon.toFixed(4)}</div></div>
        </div>
      </div>

      <div class="grid">
        <div class="card">
          <h3>Tilt / Kemiringan</h3>
          <div class="csub">garis ambang hanya memicu NOTIFIKASI, bukan sirine</div>
          <div class="chartbox"><canvas id="cTilt"></canvas></div>
        </div>
        <div class="card">
          <h3>Cuaca (BME280)</h3>
          <div class="csub">suhu · kelembapan · tekanan</div>
          <div class="chartbox"><canvas id="cWeather"></canvas></div>
        </div>
        <div class="card">
          <h3>Daya (EPEVER)</h3>
          <div class="csub">tegangan baterai & panel surya</div>
          <div class="chartbox"><canvas id="cPower"></canvas></div>
        </div>
        <div class="card">
          <h3>Kesehatan Perangkat</h3>
          <div class="csub">kualitas sinyal & status (data dummy)</div>
          <div class="stat-row">
            <div class="stat"><div class="s-lbl">RSSI</div><div class="s-val">-92 dBm</div></div>
            <div class="stat"><div class="s-lbl">SNR</div><div class="s-val">7.5 dB</div></div>
            <div class="stat"><div class="s-lbl">Uptime</div><div class="s-val">14j 32m</div></div>
            <div class="stat"><div class="s-lbl">Firmware</div><div class="s-val">0.1.0</div></div>
            <div class="stat"><div class="s-lbl">Interval</div><div class="s-val">60 s</div></div>
          </div>
          <div class="chartbox" style="height:120px;margin-top:10px"><canvas id="cRssi"></canvas></div>
        </div>
      </div>`;

    // Tilt + garis ambang
    const tilt=series(node.id,'tilt',node.status==='amber'?1.8:0.2,0.5,48).map(v=>Math.max(0,v));
    line(document.getElementById('cTilt'),L,[
      {label:'Tilt Δ (°)',data:tilt,borderColor:COLORS[node.status]||'#2ea043',
        backgroundColor:'rgba(46,160,67,.08)',fill:true},
      {label:'SIAGA 2°',data:L.map(()=>2),borderColor:'#d29922',borderDash:[5,5],pointRadius:0},
      {label:'AWAS 5°', data:L.map(()=>5),borderColor:'#e23b3b',borderDash:[5,5],pointRadius:0}
    ],{scales:{x:{ticks:{color:'#8b949e',maxTicksLimit:8,font:{size:10}},grid:{color:'#2c333b'}},
               y:{min:0,max:6,ticks:{color:'#8b949e',font:{size:10}},grid:{color:'#2c333b'}}}});

    // Cuaca
    line(document.getElementById('cWeather'),L,[
      {label:'Suhu (°C)',    data:series(node.id,'temp',27,0.8,48),borderColor:'#e23b3b'},
      {label:'Lembap (%)',   data:series(node.id,'hum',82,2,48),  borderColor:'#2f81f7'},
      {label:'Tekanan (hPa)',data:series(node.id,'press',1008,1.5,48),borderColor:'#8b949e',yAxisID:'y'}
    ]);

    // Daya
    line(document.getElementById('cPower'),L,[
      {label:'Baterai (V)',data:series(node.id,'batt',12.8,0.3,48),borderColor:'#2ea043'},
      {label:'PV (V)',     data:series(node.id,'pv',18,1.2,48),   borderColor:'#d29922'}
    ]);

    // RSSI
    line(document.getElementById('cRssi'),L,[
      {label:'RSSI (dBm)',data:series(node.id,'rssi',-90,4,48),borderColor:'#2f81f7',
        backgroundColor:'rgba(47,129,247,.08)',fill:true}
    ]);
  }

  function renderGateway(node){
    const online=loadNodes().filter(n=>n.status!=='gw'&&n.status!=='red').length;
    const offline=loadNodes().filter(n=>n.status==='red').length;
    document.getElementById('content').innerHTML=`
      <div class="head-card">
        <div>
          <h1><span class="status-dot dot-green"></span>${esc(node.id)}</h1>
          <div class="loc">${esc(node.info||'')} · Gateway</div>
        </div>
        <span class="pill online">GATEWAY</span>
        <span class="spacer"></span>
        <div class="kv">
          <div><div class="k">Koordinat</div><div class="v">${node.lat.toFixed(4)}, ${node.lon.toFixed(4)}</div></div>
        </div>
      </div>
      <div class="grid">
        <div class="card">
          <h3>Status Gateway</h3>
          <div class="csub">ringkasan node yang dipantau</div>
          <div class="stat-row">
            <div class="stat"><div class="s-lbl">Node online</div><div class="s-val" style="color:#2ea043">${online}</div></div>
            <div class="stat"><div class="s-lbl">Node offline</div><div class="s-val" style="color:#e23b3b">${offline}</div></div>
            <div class="stat"><div class="s-lbl">Uplink MQTT</div><div class="s-val">terhubung</div></div>
            <div class="stat"><div class="s-lbl">Sirine</div><div class="s-val">OFF · manual-only</div></div>
          </div>
        </div>
        <div class="card">
          <h3>Catatan</h3>
          <div class="csub">gateway tidak membawa sensor longsor</div>
          <p class="dim" style="font-size:13px;line-height:1.6">
            Gateway meneruskan data semua node ke MQTT dan mengendalikan sirine (manual).
            Grafik sensor (tilt/cuaca/daya) ada di halaman detail masing-masing node.
            Kontrol sirine ada di kartu gateway pada dashboard utama.
          </p>
          <a class="back" href="dashboard.html">← kembali ke dashboard</a>
        </div>
      </div>`;
  }

  (function(){
    const id=qs('id');
    const node=loadNodes().find(n=>n.id===id);
    if(!node){
      document.getElementById('content').innerHTML=
        `<div class="notfound">Perangkat <b>${esc(id||'(kosong)')}</b> tidak ditemukan.
         <br><br><a class="back" href="dashboard.html">← kembali ke dashboard</a></div>`;
      return;
    }
    document.title='Detail '+node.id+' — EWS YG2UFH';
    if(node.status==='gw') renderGateway(node); else renderNode(node);
  })();
</script>
</body>
</html>
